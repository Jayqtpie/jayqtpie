# Refreshes the contribution data every morning and redraws the README cards.
name: Cards

on:
  schedule:
    # Every morning, well clear of the koi's 00:20 run.
    - cron: "40 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - fonts/**
      - assets/**
      - requirements.txt
      - .github/workflows/cards.yml

permissions:
  contents: write

concurrency: cards

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Render README cards (hero, tiles, activity, repos, graph)
        run: python scripts/render_cards.py
      - name: Commit the cards if they changed
        shell: bash
        run: |
          git add data cards README.md
          if git diff --cached --quiet; then
            echo "Nothing changed; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "cards: redraw from today's contributions"
          git pull --quiet --rebase
          git push --quiet
