<svg xmlns="http://www.w3.org/2000/svg" width="913.85" height="150" viewBox="0 0 913.85 150" role="img" aria-label="Ramadan-Planner: Web based Ramadan planner to accompany PDF."><style>@font-face{font-family:Archivo;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:Archivo;font-weight:800;src:url(data:font/woff;base64,) format('woff')}text{font-family:Archivo,system-ui,sans-serif}.fb{transform-box:fill-box;transform-origin:center}.fbb{transform-box:fill-box;transform-origin:50% 100%}@keyframes ring1{from{opacity:1;transform:none}to{opacity:0;transform:scale(3.4)}}@keyframes light{from{fill:#34322E}}@keyframes nudge{50%{transform:translate(3px,-3px)}}@keyframes lift{from{opacity:0;transform:translateY(12px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.m{display:none}}</style><g transform="translate(16.92 0)"><rect width="880" height="150" fill="#0B0B0A"/><rect x=".5" y=".5" width="879" height="149" fill="none" stroke="#262522"/><g style="animation:lift 0.7s cubic-bezier(.2,.8,.2,1) 2s both"><text x="40 62.56 81.31 110.34 129.09 148.38 167.14 186.3 196 217.38 225.63 244.38 263.55 282.72 301.57" y="64" font-size="32" font-weight="800" fill="#EDE9E1">Ramadan-Planner</text><rect x="314.75" y="59.58" width="4.8" height="4.8" fill="#FF1F8E" style="animation:light 0.25s ease-in 2.45s both"/><rect x="314.75" y="59.58" width="4.8" height="4.8" class="fb" fill="none" stroke="#FF1F8E" vector-effect="non-scaling-stroke" opacity="0" style="animation:ring1 1.4s ease-out 2.7s none"/><g transform="translate(829 34)"><path d="M0 11L11 0M3 0H11V8" fill="none" stroke="#EDE9E1" stroke-width="1.6" style="animation:nudge 0.7s ease-in-out 2.7s none"/></g><text x="40" y="98" font-size="17" font-weight="400" fill="#D8D3C8">Web based Ramadan planner to accompany PDF</text><text x="40" y="126" font-size="14" font-weight="400" fill="#A39E93">JavaScript</text><text x="134.58" y="126" font-size="14" font-weight="400" fill="#A39E93">Update